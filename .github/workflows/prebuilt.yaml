name: prebuilt
on:
  # Disabled: this job already no-ops via `if: github.repository ==
  # 'commaai/openpilot'` on this fork, and origin/master hasn't moved since
  # 2026-02-14 -- real work happens on dev/EOP10. An hourly schedule that
  # always skips was pure notification noise. Still runnable manually.
  # schedule:
  #   - cron: '0 * * * *'
  workflow_dispatch:

env:
  DOCKER_LOGIN: docker login ghcr.io -u ${{ github.actor }} -p ${{ secrets.GITHUB_TOKEN }}
  BUILD: selfdrive/test/docker_build.sh prebuilt

jobs:
  build_prebuilt:
    name: build prebuilt
    runs-on: ubuntu-latest
    if: github.repository == 'commaai/openpilot'
    env:
      PUSH_IMAGE: true
    permissions:
      checks: read
      contents: read
      packages: write
    steps:
    - name: Wait for green check mark
      if: ${{ github.event_name != 'workflow_dispatch' }}
      uses: lewagon/wait-on-check-action@ccfb013c15c8afb7bf2b7c028fb74dc5a068cccc
      with:
        ref: master
        wait-interval: 30
        running-workflow-name: 'build prebuilt'
        repo-token: ${{ secrets.GITHUB_TOKEN }}
        check-regexp: ^((?!.*(build master-ci).*).)*$
    - uses: actions/checkout@v4
      with:
        submodules: true
    - run: git lfs pull
    - name: Build and Push docker image
      run: |
        $DOCKER_LOGIN
        eval "$BUILD"
