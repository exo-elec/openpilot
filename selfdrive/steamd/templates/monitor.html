<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SteamD Monitor</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body {
            width: 100%; height: 100%;
            background: #0a0a0a;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            overflow: hidden;
        }
        #layout {
            display: grid;
            grid-template-columns: 1fr 360px;
            grid-template-rows: 1fr 120px;
            width: 100vw; height: 100vh;
            gap: 12px;
            padding: 12px;
        }
        #video-placeholder {
            grid-row: 1 / 3;
            background: #111;
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            border: 2px dashed #333;
        }
        #video-placeholder h2 {
            color: #666;
            font-size: 24px;
            margin-bottom: 12px;
        }
        #video-placeholder p {
            color: #444;
            font-size: 14px;
            max-width: 400px;
            line-height: 1.6;
        }
        #video-placeholder .stream-info {
            margin-top: 20px;
            font-family: monospace;
            font-size: 13px;
            color: #00ff88;
            background: rgba(0,255,136,0.08);
            padding: 10px 18px;
            border-radius: 8px;
        }
        #status-panel {
            background: #141414;
            border-radius: 16px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            border: 1px solid #222;
        }
        #status-panel h1 {
            font-size: 20px;
            color: #00ff88;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .stat-row {
            display: flex;
            justify-content: space-between;
            font-size: 20px;
            margin: 8px 0;
            padding: 6px 0;
            border-bottom: 1px solid #222;
        }
        .stat-label { color: #888; font-size: 14px; }
        .stat-value { font-weight: 700; font-variant-numeric: tabular-nums; }
        #conn-status {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            color: #888;
            margin-top: 4px;
        }
        .indicator {
            width: 10px; height: 10px;
            border-radius: 50%;
            background: #ff4444;
        }
        .indicator.connected { background: #00ff88; }
        .indicator.disconnected { background: #ff4444; }

        .blinkers {
            display: flex;
            gap: 12px;
            margin-top: 10px;
        }
        .blinker {
            flex: 1;
            text-align: center;
            padding: 8px;
            border-radius: 8px;
            background: #1a1a1a;
            font-size: 13px;
            opacity: 0.2;
            transition: opacity 0.2s;
        }
        .blinker.active { opacity: 1; background: #2a2a00; color: #ffcc00; }

        #controls-bar {
            grid-column: 2;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 16px;
            background: #141414;
            border-radius: 16px;
            border: 1px solid #222;
        }
        button {
            padding: 16px 40px;
            font-size: 18px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 700;
            transition: transform 0.1s, opacity 0.2s;
        }
        button:active { transform: scale(0.96); }
        #disengage-btn {
            background: #ff4444;
            color: #fff;
        }
        #disengage-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        /* TV / large screen */
        @media (min-width: 1600px) {
            .stat-row { font-size: 26px; }
            #status-panel h1 { font-size: 26px; }
            button { padding: 20px 48px; font-size: 22px; }
        }
        /* Mobile */
        @media (max-width: 900px) {
            #layout {
                grid-template-columns: 1fr;
                grid-template-rows: auto 1fr 100px;
            }
            #video-placeholder { grid-row: 1; min-height: 200px; }
            #status-panel { grid-row: 2; }
            #controls-bar { grid-column: 1; grid-row: 3; }
        }
    </style>
</head>
<body>
    <div id="layout">
        <div id="video-placeholder">
            <h2>UDP H264 Stream Active</h2>
            <p>Video is streamed directly to the VR headset via UDP unicast.<br>Browser-based playback is not supported for raw MPEG-TS H264.</p>
            <div class="stream-info" id="stream-target">—</div>
        </div>

        <div id="status-panel">
            <div>
                <h1>SteamD Monitor</h1>
                <div id="conn-status">
                    <span id="conn-indicator" class="indicator disconnected"></span>
                    <span id="conn-status-text">Disconnected</span>
                </div>
            </div>
            <div>
                <div class="stat-row">
                    <span class="stat-label">Speed</span>
                    <span class="stat-value"><span id="speed">0</span> km/h</span>
                </div>
                <div class="stat-row">
                    <span class="stat-label">Steering</span>
                    <span class="stat-value"><span id="steering">0</span>°</span>
                </div>
                <div class="stat-row">
                    <span class="stat-label">Mode</span>
                    <span class="stat-value" id="mode">Standby</span>
                </div>
                <div class="stat-row">
                    <span class="stat-label">Gear</span>
                    <span class="stat-value" id="gear">N</span>
                </div>
                <div class="stat-row">
                    <span class="stat-label">Gas / Brake</span>
                    <span class="stat-value"><span id="gas">0</span>% / <span id="brake">0</span>%</span>
                </div>
                <div class="stat-row">
                    <span class="stat-label">View</span>
                    <span class="stat-value" id="view-mode">road</span>
                </div>
                <div class="stat-row">
                    <span class="stat-label">UDP Lag</span>
                    <span class="stat-value" id="udp-last">N/A</span>
                </div>
                <div class="blinkers">
                    <div class="blinker" id="left-blinker">◄ LEFT</div>
                    <div class="blinker" id="right-blinker">RIGHT ►</div>
                </div>
            </div>
        </div>

        <div id="controls-bar">
            <button id="disengage-btn" onclick="window.steamdClient && window.steamdClient.disengage()">EMERGENCY STOP</button>
        </div>
    </div>

    <script src="/static/steamd.js"></script>
</body>
</html>
